# This repository consumes the docsys engine the way any adopter does: as a
# development dependency. Here it resolves to the submodule, installed editable,
# so a change to the engine is exercised on this corpus before it is released.
# An adopter pins a git tag instead:
#   docsys = { git = "https://github.com/Skl8em/docsys", tag = "vX.Y.Z" }

[project]
name = "documentality"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["docsys"]

[tool.uv]
package = false

[tool.uv.sources]
docsys = { path = "docsys", editable = true }

# This repository's own Python is tools/, its own checks, run by `docsys check` as
# tools. This project locks no type checker or linter, so tools/ stays out of both,
# as the editor would otherwise run them on it. docsys/ is checked by its own
# configuration (open documentation-system.code-workspace in the editor).
[tool.basedpyright]
exclude = ["docsys", "tools", ".venv"]
ignore = ["tools"]

[tool.ruff]
extend-exclude = ["docsys", "tools"]
force-exclude = true
