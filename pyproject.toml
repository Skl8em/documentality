# This repository consumes the docsys engine the way any adopter does: as a
# development dependency. Here it resolves to the submodule, installed editable,
# so a change to the engine is exercised on this corpus before it is released.
# An adopter pins a git tag instead:
#   docsys = { git = "https://github.com/Skl8em/docsys", tag = "vX.Y.Z" }

[project]
name = "documentality"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
# basedpyright and ruff at the versions the engine's uv.lock pins (the Phase 14
# ruling "The tools for Python"): moved by hand when the engine moves them.
# reuse checks the licensing REUSE.toml declares (ADR-043); its charset-normalizer
# extra detects file encodings in Python, where the default needs the system's libmagic.
dev = [
    "basedpyright==1.40.2",
    "docsys",
    "reuse[charset-normalizer]>=6.2.0",
    "ruff==0.17.0",
]

[tool.uv]
package = false

[tool.uv.sources]
docsys = { path = "docsys", editable = true }

# This repository's own Python is tools/, its own checks, run by `docsys check` as
# tools, and checked the way the engine checks its own: strict, `Any` refused, by
# the copies uv.lock pins, run by the gate (docsys.yaml) and by the editor alike.
# docsys/ is checked by its own configuration (open documentation-system.code-workspace
# in the editor).
[tool.basedpyright]
include = ["tools"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportAny = "error"
reportExplicitAny = "error"

[tool.ruff]
line-length = 120
# Python only: ruff's default `include` also formats the code blocks of every *.md,
# which would make it a check on the corpus.
include = ["*.py", "*.pyi"]
extend-exclude = ["docsys"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "PT", "RUF", "SIM"]
# The em dash is deliberate in messages ("… — fix: …").
allowed-confusables = ["—"]
