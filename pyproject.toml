# This repository consumes the docsys engine the way any adopter does: as a
# development dependency. Here it resolves to the submodule, installed editable,
# so a change to the engine is exercised on this corpus before it is released.
# An adopter pins a git tag instead:
#   docsys = { git = "https://github.com/Skl8em/docsys", tag = "vX.Y.Z" }

[project]
name = "documentality"
version = "0"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["docsys"]

[tool.uv]
package = false

[tool.uv.sources]
docsys = { path = "docsys", editable = true }

# This repository's own Python is scripts/, retired as its checks move to docsys, and
# one markdownlint fixture under tools/; neither is typed or formatted, so both stay
# out of the type checker and the linter. docsys/ is checked by its own configuration
# (open documentation-system.code-workspace in the editor).
[tool.basedpyright]
exclude = ["docsys", "scripts", "tools", ".venv"]
ignore = ["scripts", "tools"]

[tool.ruff]
extend-exclude = ["docsys", "scripts", "tools"]
force-exclude = true
