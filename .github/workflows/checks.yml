name: checks

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs Nix with flakes enabled. Pin to a released tag for full reproducibility.
      - uses: DeterminateSystems/nix-installer-action@main
      # Same pinned toolchain (flake.lock) and same gate as local.
      - run: nix develop --command python3 scripts/check.py
