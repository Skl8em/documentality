name: checks

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the engine, docsys/, is a submodule, installed from it: the gate runs it.
          submodules: true
          # paired-change reads commits back to `paired_change.since`; a shallow
          # checkout would lose the anchor and the check would refuse to run.
          fetch-depth: 0
      # Installs Nix with flakes enabled.
      - uses: DeterminateSystems/nix-installer-action@v23
      # The same pinned toolchain (flake.lock), the same locked environment and the
      # same gate as local.
      - run: nix develop --command uv sync --locked
      - run: nix develop --command uv run --locked docsys check
