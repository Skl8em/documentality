# What docsys checks in THIS repository, and how: `uv run --locked docsys check`.
#
# The engine, docsys, knows how to check documentation; this file says where this
# repository keeps its decision register and its phases, which documents are out of
# scope and why, where the paired-change rule bites, and which external tools run
# after the engine's checks. Every key is explained in codifying/docsys-configuration.md;
# what each check verifies is explained with the engine, in docsys/docs/.
version: 1

# Every Markdown file under the workspace is a document unless excluded here, with
# its reason. `docsys report` lists these exclusions and how many documents each
# leaves out. (.markdownlint-cli2.jsonc keeps its own, wider list: markdownlint
# reads no config but its own.)
scope:
  exclude:
    theorising/: raw upstream essays, not authored with the system's frontmatter
    phases/naive-sketch/: pre-refoundation frozen records, which predate `intention`
    .claude/: the agent's configuration and skills, not documents
    "**/blind-test/": raw agent transcripts, not catalogued documents
    docsys/: the engine's submodule, another repository, checked by its own CI
    .venv/: the virtual environment uv builds, with its packages' files
    .direnv/: direnv's cache of the devShell

# The dead links the link check accepts: links from frozen records, which cannot be
# edited, to what has since been retired. `links/allowance` reports an allowance
# whose link resolves again or is gone, so the list cannot outlive its reasons.
links:
  allow:
    - document: phases/refoundation/phase-09-tooling/plan.md
      target: ../../../scripts/linkcheck.py
      reason: scripts/ retired when the gate became docsys check (ADR-044); the record is frozen
    - document: phases/refoundation/phase-11-tooling-hardening/plan.md
      target: ../../../scripts/frontmatter_lint.py
      reason: scripts/ retired when the gate became docsys check (ADR-044); the record is frozen
    - document: phases/refoundation/phase-12-codifying/engine-config-seam.md
      target: ../../../schema/frontmatter-rules.yaml
      reason: schema/ retired with scripts/, the engine's vocabulary being the one copy (ADR-044); the record is frozen
    - document: phases/refoundation/phase-12-codifying/engine-config-seam.md
      target: ../../../scripts/docsys_config.py
      reason: scripts/ retired when the gate became docsys check (ADR-044); the record is frozen
    - document: phases/refoundation/phase-11-tooling-hardening/yaml-source-generated-json.md
      target: ../../../codifying/schema-pipeline.md
      reason: the fiche on the schema pipeline retired with the pipeline (ADR-044); the record is frozen

# The central decision register, cross-checked against each record's own
# `superseded-by`. A decision row is a table row with `columns` cells; the
# `ordinal_column` cell matches `ordinal_pattern` (group 1: the ordinal, group 2:
# the link to the record), the `status_column` cell is searched for
# `superseded_pattern` (group 1: the ordinal of the superseding decision).
register:
  path: steering/ADR.md
  columns: 5
  ordinal_column: 0
  status_column: 4
  ordinal_pattern: '^\[(\d+)\]\(([^)]+)\)$'
  superseded_pattern: 'superseded by (\d+)'

# The paired-change rule (ADR-039, ADR-040): a commit that changes the mechanism
# must touch something a person reads to understand it, in the same commit.
#  - mechanism: what decides what the gate runs and how — this file, this
#    repository's own checks (tools/), the hook, the CI workflows and the devShell.
#    The submodule pointer `docsys` is not mechanism: the engine's changes are paired
#    with their accounts in the engine's repository.
#  - exempt: the tests of tools/, which explain themselves.
#  - since: the last commit of the old gate (scripts/check.py), whose mechanism list
#    named scripts/ and schema/; the commits before it answered to that list, and
#    would fail this one.
#  - enforce_on: the rule fails on these branches and on a detached HEAD (a pull
#    request in CI); anywhere else it warns, so work in progress is not blocked.
#    CI fetches the full history, since an anchor it cannot reach is an error.
# Moving `since` forward accepts a commit made without its account: an edit to this
# file, so a reviewer sees it. The phase ledger is NOT mechanism, which is why it is
# kept out of this file: a phase transition is a ruling, explained by the roadmap.
paired_change:
  since: 0e16a6289700ebd43e1f6d581f421745d44e8418
  mechanism: [docsys.yaml, tools/, .githooks/, .github/workflows/, flake.nix]
  understanding: [writing/, structuring/, operationalizing/, codifying/, steering/ARCHITECTURE.md]
  exempt: [tools/test_]
  enforce_on: [main, develop]

# Where the phase ledger is: the project's declared state — which phases are done,
# which one is current, which are planned and so unnumbered (ADR-038). The rest says
# where every other place that speaks of the current phase is, and how to read it:
#  - root / folder: a numbered phase lives in <root>/<era>/<folder>;
#  - field: the format of a `phase:` frontmatter value;
#  - markers: the word a table row shows for each ledger status;
#  - tables: each table that lists phases, and the pattern of its phase rows, with
#    the named groups `number` (absent on an unnumbered row) and `marker` (optional
#    in the pattern, so a row missing one is reported rather than skipped);
#  - status: the file holding the one status line, and the pattern that finds it,
#    with the group `number`;
#  - mention: how a document names a phase by number, with the group `number`.
phases:
  ledger: steering/phases.yaml
  root: phases
  folder: 'phase-{number:02d}-{name}'
  field: '{number:02d}-{name}'
  markers: {done: done, current: in progress, planned: unnumbered}
  tables:
    - path: steering/roadmap.md
      row: '^\| \*\*(?:(?P<number>\d+) — )?[^*]+\*\*(?: \*\((?P<marker>[^)]*)\)\*)?'
    - path: phases/README.md
      row: '^\| \[(?P<number>\d+) — [^\]]+\]\([^)]*\)(?: \*\((?P<marker>[^)]*)\)\*)?'
  status:
    path: README.md
    line: '^\*\*v\S+ \(Phase (?P<number>\d+) (?:in progress|complete)\)\*\*'
  mention: '\b[Pp]hases?[ -](?P<number>\d+)'

# What runs after the engine's checks, in order, each under its own `=== name ===`.
# docsys does not pin a tool: run through `uv run` inside the devShell, `python3`
# is the .venv's interpreter and markdownlint-cli2 the version flake.lock pins.
tools:
  # One shared ruleset incl. one-sentence-per-line (ADR-021), a custom rule the
  # engine ships (docsys/src/docsys/markdownlint/) and tests in its own suite. The
  # pinned version is part of the contract with the custom rule.
  - name: markdownlint
    command: [markdownlint-cli2]
  # The editor's gate task (.vscode/tasks.json) reads this output through problem
  # matchers; their fixtures show each shape of line read, and no other.
  - name: problem-matcher
    command: [python3, tools/test_problem_matcher.py]
  # Fixtures first: a green check says nothing if it has stopped detecting.
  - name: editor-markdownlint-test
    command: [python3, tools/test_editor_markdownlint.py]
  # The editor's markdownlint extension lints with the markdownlint-cli2 it bundles,
  # which must be the version the line above runs, or the editor and the gate disagree
  # on the same file. Last: it judges this machine's editor, not the corpus.
  - name: editor-markdownlint
    command: [python3, tools/editor_markdownlint.py]
